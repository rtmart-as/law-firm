# ============================================================
# 配置模板（脱敏版）
# 使用方法：复制本文件为 application-active.yml 或
#   application-test.yml，替换 ****** 为你的真实配置。
# 真实配置文件已被 .gitignore 排除，不会提交到仓库。
# ============================================================

# 端口号配置
server:
  port: 8089

# 启用 token 校验（登录页已做好，前端请求会携带 token）
security:
  check-token: true

# 数据库连接配置
spring:
  main:
    allow-circular-references: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lvsuo?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: ******

# mybatis plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 配置 mybatis plus 在更新时只更新非空和非 NULL 的字段
      update-strategy: not_empty
  type-aliases-package: com.ychs.web.*.entity

# jwt 配置
jwt:
  # 颁发者
  issuer: ychs
  # 秘钥（请替换为你的密钥）
  secret: ******
  # 30 分钟过期
  expiration: 30

logging:
  pattern:
    console: '%d{yyyy-MM-dd} [%thread] %-5level %logger- %msg%n'

# 不需要 token 验证的请求，逗号分隔配置
ignore:
  url: /api/sysUser/login,/api/sysUser/getImage
